name: tourism_kg_alisa
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1
environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  #Firebase:
  firebase_core: ^3.10.1
  firebase_auth: ^5.5.1
  cloud_firestore: ^5.6.2
  firebase_database: ^11.3.10
  firebase_storage: ^12.3.2

  google_sign_in: ^6.2.1

  # API Networking
  dio: ^5.4.3+1
  # State Management (Equivalent to ViewModels)
  provider: ^6.1.2
  # File Handling  PDF/Word docs
  pdfrx: ^1.0.67    # To view PDFs
  file_picker: ^8.0.3                       # To select PDF/Word docs
  url_launcher: ^6.3.2                      # For opening WEB  PDF/Word docs
  image_picker: ^1.1.0                      # For selecting Photo/Avatar
  # UI & Animations:
  lottie: ^3.1.2
  # work with images:
  cached_network_image: ^3.4.1
  # For In-App  PDF/Word docs Reading in web page:
  webview_flutter: ^4.10.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
